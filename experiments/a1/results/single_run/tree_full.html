<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A1 full tree (N=3, M=2, H=5)</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #222;
  }
  #header {
    padding: 8px 16px;
    background: #f8f8f8;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #header strong { font-size: 14px; }
  #header .summary, #header .legend { color: #666; font-size: 12px; }
  #header button {
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid #bbb;
    background: #fff;
    border-radius: 3px;
  }
  #header button:hover { background: #eee; }
  .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
    border: 1px solid #888;
  }
  #cy {
    width: 100vw;
    height: calc(100vh - 50px);
  }
</style>
</head>
<body>
<div id="header">
  <strong>A1 full tree (N=3, M=2, H=5)</strong>
  <button onclick="savePng()">Save PNG</button>
  <button onclick="cy.fit()">Fit</button>
  <span class="summary">11 history nodes, 5 action nodes, 15 edges</span>
  <span class="legend">
    <span class="swatch" style="background:#cfe2f3;border-color:#3d85c6;"></span>history
    <span class="swatch" style="background:#f4cccc;border-color:#990000;border-style:dashed;"></span>terminal
    <span class="swatch" style="background:#eeeeee;border-color:#888888;"></span>inspect
    <span class="swatch" style="background:#d9ead3;border-color:#38761d;"></span>proceed
    <span class="swatch" style="background:#fff2cc;border-color:#bf9000;"></span>mitigate
    <span class="swatch" style="background:#f4cccc;border-color:#cc0000;"></span>abort
  </span>
</div>
<div id="cy"></div>
<script>
const elements = [{"data": {"id": "h1", "label": "h1\nd=0\nV=+3.981", "depth": 0, "V_robust": 3.9805820271197145, "belief": [0.85, 0.14, 0.01], "policy_action": 0, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a2", "label": "a2\ninspect", "action_index": 0, "action_name": "inspect"}, "classes": "action-node action-inspect"}, {"data": {"id": "h3", "label": "h3\nd=1\nV=+7.180", "depth": 1, "V_robust": 7.179971220362349, "belief": [0.8614613419247243, 0.13488105447663165, 0.0036576035986439224], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a4", "label": "a4\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h5", "label": "h5\nd=2\nV=+5.720", "depth": 2, "V_robust": 5.719525046667088, "belief": [0.7954747888088421, 0.1911200669422081, 0.01340514424894964], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a6", "label": "a6\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h7", "label": "h7\nd=3\nV=+4.709", "depth": 3, "V_robust": 4.709072048892435, "belief": [0.762970261072175, 0.21955641310879312, 0.017473325819031802], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a8", "label": "a8\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h9", "label": "h9\nd=4\nV=+3.678", "depth": 4, "V_robust": 3.6778807797318094, "belief": [0.7457846631725229, 0.23472313534609582, 0.01949220148138138], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a10", "label": "a10\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h11", "label": "h11\nd=5\nV=+2.261\n[TERM]", "depth": 5, "V_robust": 2.261024587473676, "belief": [0.7363886192057301, 0.24303905987754498, 0.020572320916724965], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h12", "label": "h12\nd=5\nV=+0.000\n[TERM]", "depth": 5, "V_robust": 0.0, "belief": [0.2014506953147369, 0.4912773516233496, 0.3072719530619135], "policy_action": 3, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h13", "label": "h13\nd=4\nV=+0.000\n[TERM]", "depth": 4, "V_robust": 0.0, "belief": [0.21041179467625687, 0.4893296075549811, 0.30025859776876207], "policy_action": 3, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h14", "label": "h14\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.22848235680827794, 0.4858253255625396, 0.2856923176291825], "policy_action": 3, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h15", "label": "h15\nd=2\nV=+0.000\n[TERM]", "depth": 2, "V_robust": 0.0, "belief": [0.2706094409841489, 0.48040971006850297, 0.24898084894734815], "policy_action": 3, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h16", "label": "h16\nd=1\nV=+0.000\n[TERM]", "depth": 1, "V_robust": 0.0, "belief": [0.4186315066175553, 0.4843240482945397, 0.09704444508790505], "policy_action": 3, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"source": "h1", "target": "a2"}}, {"data": {"source": "a2", "target": "h3", "label": "z=0"}}, {"data": {"source": "h3", "target": "a4"}}, {"data": {"source": "a4", "target": "h5", "label": "z=0"}}, {"data": {"source": "h5", "target": "a6"}}, {"data": {"source": "a6", "target": "h7", "label": "z=0"}}, {"data": {"source": "h7", "target": "a8"}}, {"data": {"source": "a8", "target": "h9", "label": "z=0"}}, {"data": {"source": "h9", "target": "a10"}}, {"data": {"source": "a10", "target": "h11", "label": "z=0"}}, {"data": {"source": "a10", "target": "h12", "label": "z=1"}}, {"data": {"source": "a8", "target": "h13", "label": "z=1"}}, {"data": {"source": "a6", "target": "h14", "label": "z=1"}}, {"data": {"source": "a4", "target": "h15", "label": "z=1"}}, {"data": {"source": "a2", "target": "h16", "label": "z=1"}}];

if (typeof cytoscapeDagre !== 'undefined') {
  cytoscape.use(cytoscapeDagre);
}

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: elements,
  style: [
    {
      selector: 'node.history-node',
      style: {
        'shape': 'round-rectangle',
        'background-color': '#cfe2f3',
        'border-color': '#3d85c6',
        'border-width': 2,
        'label': 'data(label)',
        'text-wrap': 'wrap',
        'text-max-width': 80,
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': 11,
        'width': 90,
        'height': 60,
      }
    },
    {
      selector: 'node.history-node.terminal',
      style: {
        'background-color': '#f4cccc',
        'border-color': '#990000',
        'border-style': 'dashed',
      }
    },
    {
      selector: 'node.action-node',
      style: {
        'shape': 'ellipse',
        'background-color': '#eeeeee',
        'border-color': '#888888',
        'border-width': 2,
        'label': 'data(label)',
        'text-wrap': 'wrap',
        'text-max-width': 70,
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': 10,
        'width': 70,
        'height': 50,
      }
    },
    {
      selector: 'node.action-inspect',
      style: { 'background-color': '#eeeeee', 'border-color': '#888888' }
    },
    {
      selector: 'node.action-proceed',
      style: { 'background-color': '#d9ead3', 'border-color': '#38761d' }
    },
    {
      selector: 'node.action-mitigate',
      style: { 'background-color': '#fff2cc', 'border-color': '#bf9000' }
    },
    {
      selector: 'node.action-abort',
      style: { 'background-color': '#f4cccc', 'border-color': '#cc0000' }
    },
    {
      selector: 'edge',
      style: {
        'width': 1.5,
        'line-color': '#999',
        'target-arrow-color': '#999',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 0.8,
        'curve-style': 'bezier',
        'label': 'data(label)',
        'font-size': 10,
        'color': '#444',
        'text-background-color': '#fff',
        'text-background-opacity': 0.9,
        'text-background-padding': 2,
      }
    },
  ],
  layout: {
    name: 'dagre',
    rankDir: 'TB',
    nodeSep: 40,
    rankSep: 60,
    edgeSep: 20,
  },
});

function savePng() {
  const png = cy.png({ full: true, scale: 2, bg: '#ffffff' });
  const a = document.createElement('a');
  a.href = png;
  a.download = 'tree_full.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
</body>
</html>
