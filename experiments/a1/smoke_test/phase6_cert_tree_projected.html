<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phase 6 cert - projected tree (|S_in|=2, |Z_in|=2)</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #222;
  }
  #header {
    padding: 8px 16px;
    background: #f8f8f8;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #header strong { font-size: 14px; }
  #header .summary, #header .legend { color: #666; font-size: 12px; }
  #header button {
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid #bbb;
    background: #fff;
    border-radius: 3px;
  }
  #header button:hover { background: #eee; }
  .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
    border: 1px solid #888;
  }
  #cy {
    width: 100vw;
    height: calc(100vh - 50px);
  }
</style>
</head>
<body>
<div id="header">
  <strong>Phase 6 cert - projected tree (|S_in|=2, |Z_in|=2)</strong>
  <button onclick="savePng()">Save PNG</button>
  <button onclick="cy.fit()">Fit</button>
  <span class="summary">15 history nodes, 7 action nodes, 21 edges</span>
  <span class="legend">
    <span class="swatch" style="background:#cfe2f3;border-color:#3d85c6;"></span>history
    <span class="swatch" style="background:#f4cccc;border-color:#990000;border-style:dashed;"></span>terminal
    <span class="swatch" style="background:#eeeeee;border-color:#888888;"></span>inspect
    <span class="swatch" style="background:#d9ead3;border-color:#38761d;"></span>proceed
    <span class="swatch" style="background:#fff2cc;border-color:#bf9000;"></span>mitigate
    <span class="swatch" style="background:#f4cccc;border-color:#cc0000;"></span>abort
  </span>
</div>
<div id="cy"></div>
<script>
const elements = [{"data": {"id": "h1", "label": "h1\nd=0\nV=+0.000", "depth": 0, "V_robust": 0.0, "belief": [0.13262516949785552, 0.12870550337530776], "policy_action": 0, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a2", "label": "a2\ninspect", "action_index": 0, "action_name": "inspect"}, "classes": "action-node action-inspect"}, {"data": {"id": "h3", "label": "h3\nd=1\nV=+0.000", "depth": 1, "V_robust": 0.0, "belief": [0.5225072888809871, 0.477492711119013], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a4", "label": "a4\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h5", "label": "h5\nd=2\nV=+0.000", "depth": 2, "V_robust": 0.0, "belief": [0.5006350286145366, 0.4993649713854634], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a6", "label": "a6\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h7", "label": "h7\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.48353281265400094, 0.5164671873459991], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h8", "label": "h8\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.2843398069373421, 0.7156601930626578], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h9", "label": "h9\nd=2\nV=+0.000", "depth": 2, "V_robust": 0.0, "belief": [0.2984682197103365, 0.7015317802896636], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a10", "label": "a10\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h11", "label": "h11\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.3114008818900483, 0.6885991181099518], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h12", "label": "h12\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.16101152332149332, 0.8389884766785067], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h13", "label": "h13\nd=1\nV=+0.000", "depth": 1, "V_robust": 0.0, "belief": [0.317116985348983, 0.6828830146510171], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a14", "label": "a14\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h15", "label": "h15\nd=2\nV=+0.000", "depth": 2, "V_robust": 0.0, "belief": [0.3284270274974413, 0.6715729725025588], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a16", "label": "a16\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h17", "label": "h17\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.33863166080202883, 0.6613683391979711], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h18", "label": "h18\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.1785003694450638, 0.8214996305549361], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h19", "label": "h19\nd=2\nV=+0.000", "depth": 2, "V_robust": 0.0, "belief": [0.17186728241776472, 0.8281327175822353], "policy_action": 1, "is_terminal": false}, "classes": "history-node"}, {"data": {"id": "a20", "label": "a20\nproceed", "action_index": 1, "action_name": "proceed"}, "classes": "action-node action-proceed"}, {"data": {"id": "h21", "label": "h21\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.18880017569465693, 0.8111998243053431], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"id": "h22", "label": "h22\nd=3\nV=+0.000\n[TERM]", "depth": 3, "V_robust": 0.0, "belief": [0.08989087386690822, 0.9101091261330918], "policy_action": 1, "is_terminal": true}, "classes": "history-node terminal"}, {"data": {"source": "h1", "target": "a2"}}, {"data": {"source": "a2", "target": "h3", "label": "z=0"}}, {"data": {"source": "h3", "target": "a4"}}, {"data": {"source": "a4", "target": "h5", "label": "z=0"}}, {"data": {"source": "h5", "target": "a6"}}, {"data": {"source": "a6", "target": "h7", "label": "z=0"}}, {"data": {"source": "a6", "target": "h8", "label": "z=1"}}, {"data": {"source": "a4", "target": "h9", "label": "z=1"}}, {"data": {"source": "h9", "target": "a10"}}, {"data": {"source": "a10", "target": "h11", "label": "z=0"}}, {"data": {"source": "a10", "target": "h12", "label": "z=1"}}, {"data": {"source": "a2", "target": "h13", "label": "z=1"}}, {"data": {"source": "h13", "target": "a14"}}, {"data": {"source": "a14", "target": "h15", "label": "z=0"}}, {"data": {"source": "h15", "target": "a16"}}, {"data": {"source": "a16", "target": "h17", "label": "z=0"}}, {"data": {"source": "a16", "target": "h18", "label": "z=1"}}, {"data": {"source": "a14", "target": "h19", "label": "z=1"}}, {"data": {"source": "h19", "target": "a20"}}, {"data": {"source": "a20", "target": "h21", "label": "z=0"}}, {"data": {"source": "a20", "target": "h22", "label": "z=1"}}];

if (typeof cytoscapeDagre !== 'undefined') {
  cytoscape.use(cytoscapeDagre);
}

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: elements,
  style: [
    {
      selector: 'node.history-node',
      style: {
        'shape': 'round-rectangle',
        'background-color': '#cfe2f3',
        'border-color': '#3d85c6',
        'border-width': 2,
        'label': 'data(label)',
        'text-wrap': 'wrap',
        'text-max-width': 80,
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': 11,
        'width': 90,
        'height': 60,
      }
    },
    {
      selector: 'node.history-node.terminal',
      style: {
        'background-color': '#f4cccc',
        'border-color': '#990000',
        'border-style': 'dashed',
      }
    },
    {
      selector: 'node.action-node',
      style: {
        'shape': 'ellipse',
        'background-color': '#eeeeee',
        'border-color': '#888888',
        'border-width': 2,
        'label': 'data(label)',
        'text-wrap': 'wrap',
        'text-max-width': 70,
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': 10,
        'width': 70,
        'height': 50,
      }
    },
    {
      selector: 'node.action-inspect',
      style: { 'background-color': '#eeeeee', 'border-color': '#888888' }
    },
    {
      selector: 'node.action-proceed',
      style: { 'background-color': '#d9ead3', 'border-color': '#38761d' }
    },
    {
      selector: 'node.action-mitigate',
      style: { 'background-color': '#fff2cc', 'border-color': '#bf9000' }
    },
    {
      selector: 'node.action-abort',
      style: { 'background-color': '#f4cccc', 'border-color': '#cc0000' }
    },
    {
      selector: 'edge',
      style: {
        'width': 1.5,
        'line-color': '#999',
        'target-arrow-color': '#999',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 0.8,
        'curve-style': 'bezier',
        'label': 'data(label)',
        'font-size': 10,
        'color': '#444',
        'text-background-color': '#fff',
        'text-background-opacity': 0.9,
        'text-background-padding': 2,
      }
    },
  ],
  layout: {
    name: 'dagre',
    rankDir: 'TB',
    nodeSep: 40,
    rankSep: 60,
    edgeSep: 20,
  },
});

function savePng() {
  const png = cy.png({ full: true, scale: 2, bg: '#ffffff' });
  const a = document.createElement('a');
  a.href = png;
  a.download = 'phase6_cert_tree_projected.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
</body>
</html>
